# =====================================================
# CONFIGURATION PRODUCTION (Render + Docker)
# Toutes les valeurs ${...} viennent des variables
# d'environnement définies dans le dashboard Render.
#
# IMPORTANT : Sur Render, ajoutez la variable :
#   SPRING_PROFILES_ACTIVE = prod
# pour que Spring Boot charge CE fichier et non
# application.properties (qui pointe sur localhost).
# =====================================================

server.port=${PORT:8080}

# ── MySQL Aiven ──────────────────────────────────────
# URL CORRIGÉE (sans paramètres SSL qui causaient l'erreur)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── SendGrid (HTTPS port 443 — jamais bloqué par Render) ──
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}

# ── Upload fichiers ──────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ── CORS : URL de votre frontend Netlify ─────────────
app.cors.allowed-origins=${FRONTEND_URL}
app.mail.delay-between-emails=500

# ── JWT ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
